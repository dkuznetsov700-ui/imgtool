[project]
name = "imgtool"
version = "0.1.0"
description = "Terminal image editor with Kitty graphics protocol preview"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "YOUR NAME"},
]
keywords = ["image", "tui", "curses", "cli", "terminal", "kitty"]
classifiers = [
    "Environment :: Console :: Curses",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/dkuznetsov700-ui/imgtool"
Repository = "https://github.com/dkuznetsov700-ui/imgtool"
Issues = "https://github.com/dkuznetsov700-ui/imgtool/issues"

[project.scripts]
imgtool = "imgtool:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
